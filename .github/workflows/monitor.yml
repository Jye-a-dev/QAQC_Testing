name: Shift-Right Performance & Availability Monitoring

on:
  schedule:
    # Kích hoạt tự động vào phút 0 của mỗi giờ (ví dụ: 1:00, 2:00, ...)
    - cron: '0 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công trên GitHub Actions bất kỳ lúc nào

jobs:
  monitor-endpoint:
    name: Monitor /api/users Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      # Dùng Newman thực thi trực tiếp URL kèm kịch bản kiểm tra SLA và Availability
      - name: Check Availability & Performance SLA
        run: |
          newman run "https://reqres.in/api/users?page=1" \
            --test-scripts <(cat << 'EOF'
          // 1. Kiểm tra tính sẵn sàng (Availability)
          pm.test("Status code is 200 (Availability Check)", function () {
              pm.response.to.have.status(200);
          });

          // 2. Kiểm tra hiệu năng phản hồi (SLA / Performance Check)
          pm.test("Response time is below 800ms (Performance SLA)", function () {
              pm.expect(pm.response.responseTime).to.be.below(800);
          });
          EOF
          )
